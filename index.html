<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <div id="calculator-widget">
        <div id="display"></div>
        <div id="button-row">
            <button class="command">CLEAR</button>
            <button class="command">DEL</button>
            <button class="operator">*</button>
            <button class="operator">/</button>
        </div>
        <div id="button-row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">+</button>
        </div>
        <div id="button-row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>
        <div id="button-row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">=</button>
        </div>
        <div id="button-row">
            <button>.</button>
            <button>0</button>
            <button>(-)</button>
        </div>
    </div>
</body>
</html>
