<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <link rel="icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <div id="calculator-widget">
        <div id="display"></div>
        
        <div id="calculator-buttons">
            <div id="button-column">
                <button class="command">AC</button>
                <button>7</button>
                <button>4</button>
                <button>1</button>
                <button>.</button>
            </div>

            <div id="button-column">
                <button class="command">DEL</button>
                <button>8</button>
                <button>5</button>
                <button>2</button>
                <button>0</button>
            </div>

            <div id="button-column">
                <button class="operator">*</button>
                <button>9</button>
                <button>6</button>
                <button>3</button>
                <button>(-)</button>
            </div>

            <div id="button-column">
                <button class="operator">/</button>
                <button class="operator">+</button>
                <button class="operator">-</button>
                <button class="operator double-row">=</button>
            </div>
        </div>
    </div>
</body>
</html>
